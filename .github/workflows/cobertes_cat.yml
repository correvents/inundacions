name: Cobertes del sòl de Catalunya per conca

# Mapa de cobertes del sòl de l'ICGC (WMS, 2024) a la reixa de l'MDT 5 m de cada conca del tall de 100 km²:
# un GeoTIFF per conca a la Release `cobertes-cat` (per a simula_2d.py) i una capa lleugera per a conques.html.
# Necessita config/cobertes_llegenda.json (workflow «Cobertes del sòl - llegenda»).

on:
  workflow_dispatch:
    inputs:
      conques:
        description: "Conques: ids separats per comes, «totes» o «pendents»"
        default: "pendents"
      lots:
        description: "Feines (lots de conques)"
        default: "20"
  push:
    branches: [claude/project-thread-rgykfu]
    paths: [.github/workflows/cobertes_cat.yml]

permissions:
  contents: write

env:
  ETIQUETA: cobertes-cat

jobs:
  prepara:
    runs-on: ubuntu-latest
    outputs:
      matriu: ${{ steps.m.outputs.matriu }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          pip install -q numpy requests
          echo "matriu=$(python3 scripts/cobertes.py lots --lots '${{ inputs.lots || '20' }}' --conques '${{ inputs.conques || 'pendents' }}')" >> "$GITHUB_OUTPUT"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$ETIQUETA" -R "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "$ETIQUETA" -R "${{ github.repository }}" --target main --title "Cobertes del sòl de Catalunya per conques" \
            --notes "Mapa de cobertes del sòl de Catalunya 2024 (ICGC, CC BY 4.0, 41 classes), del WMS de l'ICGC a 2,5 m i passat per moda a la reixa de l'MDT de 5 m de cada conca (Release mdt5-cat): mateix EPSG:25830, origen i mida. GeoTIFF uint8 amb el codi de coberta (1-41; 0 = sense dades). Llegenda: config/cobertes_llegenda.json; paràmetres hidrològics: config/cobertes_parametres.json. Fet amb scripts/cobertes.py."

  calcula:
    needs: prepara
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepara.outputs.matriu) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests numpy rasterio pyproj shapely pillow
      - name: Conques ${{ matrix.lot }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fallades=""
          for id in ${{ matrix.lot }}; do
            nom=$(printf "c%03d" "$id")
            if timeout 2400 python3 scripts/cobertes.py conca --id "$id"; then
              gh release upload "$ETIQUETA" "/tmp/cobertes/cobertes5_$nom.tif" -R "${{ github.repository }}" --clobber || fallades="$fallades $id"
            else
              fallades="$fallades $id"
            fi
            rm -f /tmp/cobertes/*.tif
          done
          echo "Fallades:$fallades"
          mkdir -p data/catalunya/cobertes; echo "$fallades" > data/catalunya/cobertes/fallades_${{ strategy.job-index }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertes-${{ strategy.job-index }}
          path: data/catalunya/cobertes/
          if-no-files-found: ignore

  desa:
    needs: calcula
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cobertes-*
          merge-multiple: true
          path: /tmp/art
      - run: pip install -q numpy requests
      - name: Desa
        run: |
          mkdir -p data/catalunya/cobertes
          f=$(cat /tmp/art/fallades_*.txt 2>/dev/null | tr -s ' \n' ' ')
          rm -f /tmp/art/fallades_*.txt
          cp -r /tmp/art/. data/catalunya/cobertes/ 2>/dev/null || true
          python3 scripts/cobertes.py index
          echo "### Cobertes: conques fallades: ${f:-cap}" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalunya/cobertes
          git diff --cached --quiet && exit 0
          git commit -m "Cobertes del sòl per conca (ICGC 2024)"
          for i in 1 2 3 4; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0; sleep $((i*5)); done; exit 1
