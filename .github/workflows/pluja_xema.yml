name: Pluja XEMA (sèrie llarga)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xema:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python3 scripts/pluja_xema.py --config config/ridaura.json
      - name: Desa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Sèrie de pluja XEMA i episodis de pluja forta"
          for i in 1 2 3 4 5 6; do git pull --rebase origin main && git push && exit 0; sleep $((i*7)); done; exit 1
