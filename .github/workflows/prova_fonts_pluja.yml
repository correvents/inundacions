name: Prova fonts de pluja 2026 (temporal)

on:
  push:
    branches: [claude/project-thread-f1uruf]
    paths: [".github/workflows/prova_fonts_pluja.yml", "scripts/prova_fonts_pluja.py"]

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python3 scripts/prova_fonts_pluja.py
