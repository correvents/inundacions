name: Simulació 2D d'episodis

on:
  workflow_dispatch:
    inputs:
      episodis:
        description: 'Llista JSON [{"id": "2026-10-04", "radar": "2026-10-03_radar.json", "episodi": "2026-10-04.json" (opcional), "ia": 150}]'
        required: true
      conca:
        description: "Conca (config/<conca>.json)"
        default: "ridaura"
      pas:
        description: "Mida de cel·la (m)"
        default: "20"
      n_natural:
        description: "n de Manning del terreny natural"
        default: "0.1"
      ia_urba:
        description: "Llindar de pèrdues de les zones construïdes (mm)"
        default: "5"
      perdua_natural:
        description: "Infiltració del terreny natural un cop superat el llindar (mm/h)"
        default: "12"
      extra_hores:
        description: "Hores sense pluja després del radar, per veure el buidat"
        default: "24"
      passos:
        description: "Passos sota terraplens (OSM): si = oberts, amb les obres de drenatge al cabal de disseny; obstruits = obres a la meitat; no"
        default: "si"
      edificis:
        description: "Edificis del Cadastre com a obstacles i soterranis (si/no)"
        default: "si"
      clavegueram:
        description: "Capacitat dels embornals a les zones construïdes (mm/h)"
        default: "30"

permissions:
  contents: write

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        ep: ${{ fromJSON(inputs.episodis) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy pandas rasterio pyproj shapely pillow numba scipy pysheds
      - name: Relleu
        run: python3 scripts/relleu.py --config config/${{ inputs.conca }}.json --pas 10 --nomes-mdt
      - name: Passos inferiors
        if: inputs.passos != 'no'
        run: python3 scripts/passos.py --config config/${{ inputs.conca }}.json --mdt /tmp/relleu/mdt.tif
      - name: Simulació
        run: |
          rm -rf "data/${{ inputs.conca }}/sim2d/${{ matrix.ep.id }}"
          EP=""; [ -n "${{ matrix.ep.episodi }}" ] && EP="--episodi data/${{ inputs.conca }}/episodis/${{ matrix.ep.episodi }}"
          CAP="data/${{ inputs.conca }}/passos/capacitat.json"
          if [ "${{ inputs.passos }}" != "no" ] && [ -f "$CAP" ]; then EP="$EP --passos-cap $CAP"; [ "${{ inputs.passos }}" = "obstruits" ] && EP="$EP --obstruccio 0.5"; fi
          ED="data/${{ inputs.conca }}/cadastre/edificis.json.gz"; [ -f "$ED" ] && [ "${{ inputs.edificis }}" != "no" ] && EP="$EP --edificis $ED"
          python3 scripts/simula_2d.py --config config/${{ inputs.conca }}.json --mdt /tmp/relleu/mdt.tif --id "${{ matrix.ep.id }}" \
            --radar "data/${{ inputs.conca }}/episodis/${{ matrix.ep.radar }}" $EP --pas "${{ inputs.pas }}" \
            --ia-natural "${{ matrix.ep.ia }}" --ia-urba "${{ inputs.ia_urba }}" --n-natural "${{ inputs.n_natural }}" \
            --perdua-natural "${{ inputs.perdua_natural }}" --clavegueram "${{ inputs.clavegueram }}" --extra-hores "${{ inputs.extra_hores }}"
      - name: Desa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/${{ inputs.conca }}/sim2d; [ -d data/${{ inputs.conca }}/passos ] && git add -A data/${{ inputs.conca }}/passos
          git diff --cached --quiet && exit 0
          git commit -m "Simulació 2D de l'episodi ${{ matrix.ep.id }}"
          for i in 1 2 3 4 5 6; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*7)); done; exit 1
