name: Simulació 2D d'episodis

on:
  workflow_dispatch:
    inputs:
      episodis:
        description: 'Llista JSON [{"id": "2026-10-04", "radar": "2026-10-03_radar.json", "episodi": "2026-10-04.json" (opcional), "ia": 150, "sol": "B|mapa|mapa-sup|litologia" (opcional), "sol_ref": "mitjana|B" (opcional)}]; opcionals per episodi (passen per davant de les entrades): "pas", "perdua", "perdua_sobre" (calat/pluja), "grup_sol" (A-D), "cobertes" ("no"), "clavegueram_desti" (perdut/riu), "passos" (tapats/oberts/arrossegalls), "obertura" (petita/mitjana)'
        required: true
      conca:
        description: "Conca (config/<conca>.json)"
        default: "ridaura"
      pas:
        description: "Mida de cel·la (m)"
        default: "20"
      n_natural:
        description: "n de Manning del terreny natural (només si encara no hi ha cobertes de l'ICGC per a la conca)"
        default: "0.1"
      ia_urba:
        description: "Llindar de pèrdues de les zones construïdes (mm)"
        default: "5"
      perdua_natural:
        description: "Infiltració del terreny natural un cop superat el llindar (mm/h)"
        default: "12"
      extra_hores:
        description: "Hores sense pluja després del radar, per veure el buidat"
        default: "24"
      edificis:
        description: "Edificis del Cadastre com a obstacles i soterranis (si/no)"
        default: "si"
      clavegueram:
        description: "Capacitat dels embornals a les zones construïdes (mm/h), escenari fix"
        default: "30"
      planta_baixa:
        description: "OPCIÓ: ús de la planta baixa (ids de conca del tall de 100 km², p. ex. 124,125; buit = no)"
        default: ""
      escenari_clavegueram:
        description: "Clavegueram: fix (el de dalt), funciona (estimat T10), antic (T2) o collapsat (T10 × 0,25)"
        default: "fix"
      clavegueram_ofegat:
        description: "Calat al desguàs (m) a partir del qual la xarxa no desguassa (0 = mai)"
        default: "0"
      opcions:
        description: "Opcions a provar, separades per espais: diposit (edificis com a dipòsit), velocitat (velocitat i perill H1-H6)"
        default: ""
      met:
        description: "Relleu a les zones urbanes: no (només MDT 5 m IGN), 2008 (MET 2 m ICGC, LiDAR 2008-2011) o 2021 (MET 1 m ICGC 2021-2023 a 2 m). Amb MET, convé un pas petit (2-5 m)"
        default: "no"

permissions:
  contents: write

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        ep: ${{ fromJSON(inputs.episodis) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy rasterio pyproj shapely pillow numba scipy
      - name: Relleu
        run: |
          if [ "${{ inputs.met }}" = "2008" ] || [ "${{ inputs.met }}" = "2021" ]; then
            # reixa directament al pas de la simulació (fins a 10 m), perquè el detall de 2 m no es perdi abans
            python3 scripts/relleu.py --config config/${{ inputs.conca }}.json --pas "$(python3 -c 'print(min(10, float("${{ inputs.pas }}")))')" --nomes-mdt --met "${{ inputs.met }}"
          else
            python3 scripts/relleu.py --config config/${{ inputs.conca }}.json --pas 10 --nomes-mdt
          fi
      - name: Simulació
        env:
          PLANTA_BAIXA: ${{ inputs.planta_baixa }}
          OPCIONS: ${{ inputs.opcions }}
        run: |
          OPC=""
          for o in $OPCIONS; do
            case "$o" in
              diposit) OPC="$OPC --edificis-diposit" ;;
              velocitat) OPC="$OPC --velocitat" ;;
              *) echo "Opció desconeguda: $o"; exit 1 ;;
            esac
          done
          rm -rf "data/${{ inputs.conca }}/sim2d/${{ matrix.ep.id }}"
          EP=""; [ -n "${{ matrix.ep.episodi }}" ] && EP="--episodi data/${{ inputs.conca }}/episodis/${{ matrix.ep.episodi }}"
          ED="data/${{ inputs.conca }}/cadastre/edificis.json.gz"; [ -f "$ED" ] && [ "${{ inputs.edificis }}" != "no" ] && EP="$EP --edificis $ED"
          [ -n "${{ matrix.ep.sol }}" ] && EP="$EP --grup-sol ${{ matrix.ep.sol }}"
          [ -n "${{ matrix.ep.sol_ref }}" ] && EP="$EP --sol-referencia ${{ matrix.ep.sol_ref }}"
          PB=""; for c in $(echo "$PLANTA_BAIXA" | tr ',' ' '); do f=$(printf "data/catalunya/planta_baixa/c%03d.json" "$c"); [ -f "$f" ] && PB="$PB $f"; done
          [ -n "$PB" ] && EP="$EP --planta-baixa $PB"
          python3 scripts/simula_2d.py --config config/${{ inputs.conca }}.json --mdt /tmp/relleu/mdt.tif --id "${{ matrix.ep.id }}" \
            --radar "data/${{ inputs.conca }}/episodis/${{ matrix.ep.radar }}" $EP --pas "${{ matrix.ep.pas || inputs.pas }}" \
            --ia-natural "${{ matrix.ep.ia }}" --ia-urba "${{ inputs.ia_urba }}" --n-natural "${{ inputs.n_natural }}" \
            --perdua-natural "${{ matrix.ep.perdua || inputs.perdua_natural }}" --perdua-sobre "${{ matrix.ep.perdua_sobre || 'calat' }}" \
            $([ -n "${{ matrix.ep.grup_sol }}" ] && echo --grup-sol ${{ matrix.ep.grup_sol }}) $([ "${{ matrix.ep.cobertes }}" = "no" ] && echo --sense-cobertes) --clavegueram-desti "${{ matrix.ep.clavegueram_desti || 'perdut' }}" \
            --passos "${{ matrix.ep.passos || 'tapats' }}" --obertura "${{ matrix.ep.obertura || 'petita' }}" \
            --clavegueram "${{ inputs.clavegueram }}" \
            --escenari-clavegueram "${{ inputs.escenari_clavegueram }}" --clavegueram-ofegat "${{ inputs.clavegueram_ofegat }}" --extra-hores "${{ inputs.extra_hores }}" $OPC
      - name: Desa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/${{ inputs.conca }}/sim2d
          git diff --cached --quiet && exit 0
          git commit -m "Simulació 2D de l'episodi ${{ matrix.ep.id }}"
          for i in 1 2 3 4 5 6; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*7)); done; exit 1
