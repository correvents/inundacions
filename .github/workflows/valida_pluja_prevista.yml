name: Valida la pluja prevista

# Valida pluja_prevista.py (nowcast del radar OPERA i AROME HD via Open-Meteo) i l'antelació que guanya l'avís de
# previsio.py --pluja-prevista. No desa res a Supabase. El període es parteix en trossos (un rere l'altre); l'últim
# pas els ajunta en un sol informe (al registre i com a artefacte).

on:
  push:                     # TEMPORAL: comprovació amb l'absorció nova; es treu abans de fusionar
    branches: [claude/project-thread-iham80]
    paths: [".github/workflows/valida_pluja_prevista.yml"]
  workflow_dispatch:
    inputs:
      trossos:
        description: "Trossos a fer, separats per comes (buit = tots), p. ex. b-2026-10-04,2026-10a"
        default: ""

permissions:
  contents: read
  actions: read

env:
  SUPABASE_URL: https://rxfjwklbvqkwgzmpzwae.supabase.co
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

jobs:
  tros:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 1       # Open-Meteo gratuït limita les peticions (per minut i per dia): en paral·lel es perden execucions d'AROME
      matrix:
        tros:
          - {nom: "b-2026-10-04", args: "--sense-a --episodi 2026-10-04T02:00,2026-10-04T09:30"}
          - {nom: "2026-08a", args: "--des 2026-08-11T00:00 --fins 2026-08-25T23:00"}
          - {nom: "2026-08b", args: "--des 2026-08-26T00:00 --fins 2026-09-08T23:00"}
          - {nom: "2026-09a", args: "--des 2026-09-09T00:00 --fins 2026-09-22T23:00"}
          - {nom: "2026-09b", args: "--des 2026-09-23T00:00 --fins 2026-09-30T23:00"}
          - {nom: "2026-10a", args: "--des 2026-10-01T00:00 --fins 2026-10-10T23:00"}
          - {nom: "2026-10b", args: "--des 2026-10-11T00:00 --fins 2026-10-24T23:00"}
          - {nom: "2026-10c", args: "--des 2026-10-25T00:00 --fins 2026-11-04T23:00"}
          - {nom: "2026-11a", args: "--des 2026-11-05T00:00 --fins 2026-11-11T18:00"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scipy pandas h5py pyproj shapely
      - name: Validació
        if: github.event_name == 'push' && contains(',b-2026-10-04,2026-10a,', format(',{0},', matrix.tros.nom)) || github.event_name != 'push' && (inputs.trossos == '' || contains(format(',{0},', inputs.trossos), format(',{0},', matrix.tros.nom)))
        run: |
          a="${{ matrix.tros.args }}"
          [[ "$a" == *--des* ]] || a="$a --des 2026-10-04T00:00 --fins 2026-10-04T00:00"
          python3 scripts/valida_pluja_prevista.py --config config/ridaura.json --pas 60 $a --sortida "informes/pp_${{ matrix.tros.nom }}.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pp-${{ matrix.tros.nom }}
          path: informes/pp_*.json

  informe:
    needs: tros
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scipy pandas h5py pyproj shapely
      - uses: actions/download-artifact@v4
        with:
          pattern: pp-*
          merge-multiple: true
          path: trossos
      - name: Informe
        run: python3 scripts/valida_pluja_prevista.py --config config/ridaura.json --des x --fins x --combina trossos/*.json --sortida informes/pluja_prevista.md
      - uses: actions/upload-artifact@v4
        with:
          name: validacio-pluja-prevista
          path: informes/pluja_prevista.*
