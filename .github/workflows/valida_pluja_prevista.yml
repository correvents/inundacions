name: Valida la pluja prevista

# Valida pluja_prevista.py (nowcast del radar OPERA i AROME HD via Open-Meteo) i l'antelació que guanya l'avís de
# previsio.py --pluja-prevista. No desa res a Supabase; l'informe queda com a artefacte de l'execució.

on:
  workflow_dispatch:
    inputs:
      des: {description: "Inici UTC", default: "2026-08-11T00:00"}
      fins: {description: "Final UTC", default: "2026-11-11T18:00"}
      pas: {description: "Minuts entre previsions (parts A i C)", default: "60"}
      episodi: {description: "Episodi per a l'antelació (INICI,FI)", default: "2026-10-04T02:00,2026-10-04T09:30"}

permissions:
  contents: read

jobs:
  valida:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SUPABASE_URL: https://rxfjwklbvqkwgzmpzwae.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scipy h5py pyproj shapely
      - name: Prova ràpida de les fonts
        run: |
          python3 scripts/pluja_prevista.py --config config/ridaura.json || true
          python3 scripts/pluja_prevista.py --config config/ridaura.json --ara 2026-10-04T06:00 || true
      - name: Validació
        run: |
          python3 scripts/valida_pluja_prevista.py --config config/ridaura.json --des "${{ inputs.des }}" --fins "${{ inputs.fins }}" \
            --pas "${{ inputs.pas }}" --episodi "${{ inputs.episodi }}" --sortida informes/pluja_prevista.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validacio-pluja-prevista
          path: informes/pluja_prevista.*
