name: Prova retall OPERA (temporal)
on:
  push:
    branches: [claude/project-thread-1vl8ff]
    paths: [scripts/proves/opera_retall.py, .github/workflows/prova_opera_retall.yml]
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests numpy h5py pyproj fsspec aiohttp
      - run: python3 -u scripts/proves/opera_retall.py
