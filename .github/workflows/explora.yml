name: Explora (temporal)
on:
  workflow_dispatch:
jobs:
  explora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Serveis de MDT
        run: |
          for u in "https://servicios.idee.es/wcs-inspire/mdt?SERVICE=WCS&REQUEST=GetCapabilities" \
                   "https://geoserveis.icgc.cat/servei/catalunya/mdt/wcs?SERVICE=WCS&REQUEST=GetCapabilities" \
                   "https://geoserveis.icgc.cat/icgc_mdt2m/wcs/service?SERVICE=WCS&REQUEST=GetCapabilities" \
                   "https://geoserveis.icgc.cat/servei/catalunya/mdt2m/wcs?SERVICE=WCS&REQUEST=GetCapabilities"; do
            echo "== $u"; curl -s -m 60 -o c.xml -w "%{http_code} %{size_download}\n" "$u"; grep -oE "<(wcs:)?(CoverageId|Identifier|name)>[^<]*<" c.xml | head -30; head -c 300 c.xml; echo
          done
          for u in https://datacloud.icgc.cat/datacloud/met2_ETRS89/ https://datacloud.icgc.cat/datacloud/met5_ETRS89/ https://datacloud.icgc.cat/datacloud/ ; do
            echo "== $u"; curl -s -m 60 "$u" | grep -oE 'href="[^"]+"' | head -40; done
