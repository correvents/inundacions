name: Explora (temporal)
on:
  workflow_dispatch:
jobs:
  explora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: sudo apt-get install -y poppler-utils >/dev/null 2>&1 || true
      - name: Capes ACA de pluja màxima
        run: |
          for s in wfs wms wcs; do
            curl -s -m 90 "https://aplicacions.aca.gencat.cat/geoserver/$s?service=$s&request=GetCapabilities" > c_$s.xml; ls -la c_$s.xml
            grep -oiE "<(Name|wcs:CoverageId|Title)>[^<]*(pd|precip|pluj|pluvi|isom|max|cn|escorr|p0|llindar|cabal|caudal|ridaura|retorn)[^<]*</(Name|wcs:CoverageId|Title)>" c_$s.xml | sort -u | head -80
          done
      - name: PGRI ACA (Ridaura)
        run: |
          curl -sL -m 180 -o pgri.pdf "https://aca.gencat.cat/web/.content/30_Plans_i_programes/20_Gestio_del_risc_inundacions/1er-cicle-de-planificacio/bloc1/101_1_Proposta_PGRI_ca.pdf"; ls -la pgri.pdf
          pdftotext -layout pgri.pdf p.txt && grep -n -i -B3 -A6 "ridaura\|platja d.aro" p.txt | head -150
