name: Explora (temporal)
on:
  workflow_dispatch:
jobs:
  explora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests rasterio numpy pyproj
      - name: Capes per al mètode racional
        run: |
          curl -s -m 60 "https://gis.miteco.gob.es/geoserver/ows?service=WCS&version=2.0.1&request=GetCapabilities" > cap.xml
          python3 - <<'PY'
          import re
          x=open("cap.xml").read()
          for m in re.finditer(r"<wcs:CoverageSummary>(.*?)</wcs:CoverageSummary>",x,re.S):
              b=m.group(1); i=re.search(r"CoverageId>([^<]+)<",b).group(1); t=re.search(r"Title>([^<]*)<",b)
              print(i,"|",t.group(1) if t else "")
          PY
          for u in https://www.miteco.gob.es/content/dam/miteco/es/cartografia-y-sig/ide/descargas/umbral_escorrentia_tcm30-176013.zip https://www.miteco.gob.es/content/dam/miteco/es/cartografia-y-sig/ide/descargas/i1id_tcm30-176014.zip; do
            curl -sL -m 120 -o z.zip "$u"; ls -la z.zip; unzip -l z.zip | head -30; rm -f z.zip; done
          python3 - <<'PY'
          import requests, numpy as np
          from rasterio.io import MemoryFile
          from pyproj import Transformer
          W="https://gis.miteco.gob.es/geoserver/ows"
          for T in [100,500]:
              r=requests.get(W,params=[("service","WCS"),("version","2.0.1"),("request","GetCoverage"),("coverageId",f"agua__CaudalesMaximos{T}"),("subset","Long(0.2,3.4)"),("subset","Lat(40.5,42.9)"),("subsettingCrs","http://www.opengis.net/def/crs/EPSG/0/4326"),("format","image/tiff")],timeout=180)
              with MemoryFile(r.content) as m, m.open() as ds:
                  a=ds.read(1).astype(float)
                  if ds.nodata is not None: a[a==ds.nodata]=np.nan
                  ok=np.argwhere(~np.isnan(a)); print("T",T,a.shape,"cel·les amb valor",len(ok))
                  if len(ok):
                      cols=ok[:,1]; print("  columna més a l'est amb valor", cols.max(), "lon", ds.xy(0,cols.max())[0])
          PY
