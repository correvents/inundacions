name: Explora (temporal)
on:
  workflow_dispatch:
jobs:
  explora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests rasterio numpy
      - name: CAUMAX a la Ridaura
        run: |
          python3 - <<'PY'
          import requests, rasterio, numpy as np, io
          from rasterio.io import MemoryFile
          W="https://gis.miteco.gob.es/geoserver/ows"
          d=requests.get(W,params={"service":"WCS","version":"2.0.1","request":"DescribeCoverage","coverageId":"agua__CaudalesMaximos100"},timeout=60).text
          print(d[:2500])
          punts={"aforador":(2.97912,41.81814),"desembocadura":(3.0671,41.8051)}
          for T in [2,5,10,25,100,500]:
              for sub in [("Long(2.90,3.10)","Lat(41.76,41.90)"),("E(2.90,3.10)","N(41.76,41.90)"),("x(2.90,3.10)","y(41.76,41.90)")]:
                  r=requests.get(W,params=[("service","WCS"),("version","2.0.1"),("request","GetCoverage"),("coverageId",f"agua__CaudalesMaximos{T}"),("subset",sub[0]),("subset",sub[1]),("subsettingCrs","http://www.opengis.net/def/crs/EPSG/0/4326"),("format","image/tiff")],timeout=120)
                  if r.ok and r.content[:2] in (b"II",b"MM"): break
                  print(T,sub,r.status_code,r.text[:300])
              else: continue
              with MemoryFile(r.content) as m, m.open() as ds:
                  a=ds.read(1).astype(float); nd=ds.nodata
                  if nd is not None: a[a==nd]=np.nan
                  print("T",T,ds.crs,ds.bounds,a.shape,"max",np.nanmax(a))
                  from pyproj import Transformer
                  tr=Transformer.from_crs("EPSG:4326",ds.crs,always_xy=True)
                  for nom,(lo,la) in punts.items():
                      x,y=tr.transform(lo,la); r0,c0=ds.index(x,y)
                      w=a[max(r0-6,0):r0+7,max(c0-6,0):c0+7]
                      print("  ",nom,"valor",a[r0,c0] if 0<=r0<a.shape[0] and 0<=c0<a.shape[1] else None,"max finestra",np.nanmax(w) if w.size else None)
          PY
