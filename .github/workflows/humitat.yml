name: Humitat del sòl (dades per a l'absorció inicial)

# Baixa l'evapotranspiració ERA5 (Open-Meteo), la pluja XEMA llarga i el cabal de l'aforador (arxiu ACA) que fa servir
# scripts/humitat.py, i ho desa a data/<conca>/humitat i data/<conca>/xema.

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-tt8212]
    paths: [.github/workflows/humitat.yml, scripts/humitat_dades.py]

permissions:
  contents: write

jobs:
  dades:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Baixa
        env:
          SUPABASE_URL: https://rxfjwklbvqkwgzmpzwae.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 scripts/humitat_dades.py --config config/ridaura.json --sense-aca
          python3 scripts/humitat_dades.py --config config/granollers.json
      - name: Desa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ridaura data/granollers
          git diff --cached --quiet && exit 0
          git commit -m "Dades d'humitat del sòl: ET0 ERA5, pluja XEMA i cabal ACA [skip ci]"
          for i in 1 2 3 4; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0; sleep $((i*5)); done; exit 1
