name: Prova format OPERA antic
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: pip install h5py requests
      - shell: python
        run: |
          import requests, re, h5py
          S3 = "https://s3.waw3-1.cloudferro.com/openradar-archive"
          for pref in ("2018/11/18/OPERA/COMP/OPERA@20181118T10", "2020/01/21/OPERA/COMP/OPERA@20200121T10"):
              ks = re.findall(r"<Key>([^<]+)</Key>", requests.get(S3, params={"list-type": 2, "prefix": pref}).text)
              print(pref, ks[:12])
              k = [x for x in ks if "DBZH" in x and x.endswith(".h5")][0]
              open("/tmp/c.h5", "wb").write(requests.get(S3 + "/" + requests.utils.quote(k, safe="/@")).content)
              with h5py.File("/tmp/c.h5") as h:
                  def show(n, o):
                      print(n, type(o).__name__, getattr(o, "shape", ""), {a: o.attrs[a] for a in list(o.attrs)[:14]})
                  h.visititems(show)
                  print("root attrs", dict(h.attrs))
