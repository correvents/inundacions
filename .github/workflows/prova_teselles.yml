name: Prova teselles
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://correvents.github.io/inundacions/pluja.html | grep -n "WMTS\|wmts" | head -5
          for u in \
            "https://geoserveis.icgc.cat/servei/catalunya/mapa-base/wmts/topografic/MON3857NW/14/8326/6085.png" \
            "https://geoserveis.icgc.cat/servei/catalunya/mapa-base/wmts/orto/MON3857NW/14/8326/6085.png" \
            "https://geoserveis.icgc.cat/icc_mapesmultibase/noutm/wmts/topo/GRID3857/14/8326/6085.jpeg"; do
            curl -s -m 20 -o /tmp/t -D /tmp/h -w "%{http_code} %{content_type} %{size_download} " -H "Referer: https://correvents.github.io/" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130.0" "$u"; echo " $u"; grep -i "access-control\|cross-origin\|x-frame\|content-security" /tmp/h || true; done
