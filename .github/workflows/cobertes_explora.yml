name: Cobertes del sòl - explora

on:
  push:
    branches: [claude/project-thread-rgykfu]
    paths: [.github/workflows/cobertes_explora.yml]

jobs:
  explora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Llistes
        run: |
          B=https://datacloud.icgc.cat/datacloud/cobertes-sol
          for d in "" tif_unzip/ gpkg/; do echo "== $d"; curl -sL -m 60 "$B/$d" | sed 's/<[^>]*>/ /g' | tr -s ' ' | grep -v '^ *$' | head -60 || true; done
      - name: Capçaleres
        run: |
          B=https://datacloud.icgc.cat/datacloud/cobertes-sol
          for f in $(curl -sL -m 60 "$B/tif_unzip/" | grep -o 'href="[^"]*"' | cut -d'"' -f2 | grep -i 'tif\|zip\|xml\|qml\|txt\|csv' | head -20); do
            echo "== $f"; curl -sI -m 30 "$B/tif_unzip/$f" | grep -i 'length\|type' || true
          done
          for f in $(curl -sL -m 60 "$B/gpkg/" | grep -o 'href="[^"]*"' | cut -d'"' -f2 | grep -iv '^\?\|^/' | head -20); do
            echo "== gpkg $f"; curl -sI -m 30 "$B/gpkg/$f" | grep -i 'length' || true
          done
      - name: WMS
        run: |
          curl -s -m 60 "https://geoserveis.icgc.cat/servei/catalunya/cobertes-sol/wms?REQUEST=GetCapabilities&SERVICE=WMS" | grep -i -A3 'cobertes_2024\|LegendURL' | head -40 || true
