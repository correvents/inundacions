name: Cobertes del sòl - explora

on:
  push:
    branches: [claude/project-thread-rgykfu]
    paths: [.github/workflows/cobertes_explora.yml]

jobs:
  explora:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in tif_unzip/ gpkg/ ""; do echo "== $d"; curl -sL -m 60 "https://datacloud.icgc.cat/datacloud/cobertes-sol/$d" | sed 's/<[^>]*>/ /g' | tr -s ' ' | grep -v '^ *$' | head -80; done
          sudo apt-get -qq install -y gdal-bin >/dev/null 2>&1 || true
          for f in $(curl -sL "https://datacloud.icgc.cat/datacloud/cobertes-sol/tif_unzip/" | grep -o 'href="[^"]*\.tif"' | cut -d'"' -f2 | tail -3); do
            echo "== gdalinfo $f"; gdalinfo "/vsicurl/https://datacloud.icgc.cat/datacloud/cobertes-sol/tif_unzip/$f" | head -60
          done
          curl -sL -m 60 "https://geoserveis.icgc.cat/servei/catalunya/cobertes-sol/wms?REQUEST=GetCapabilities&SERVICE=WMS" | head -c 4000
