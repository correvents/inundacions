name: Pluja de Catalunya per a la web (mensual)

on:
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes AAAA-MM"
        default: "2026-10"
  push:
    branches: [claude/project-thread-f1uruf]
    paths: [".github/workflows/pluja_catalunya.yml", "scripts/pluja_catalunya.py", "scripts/pluviometres_cat.py", "scripts/correccio_cat.py"]

permissions:
  contents: write

jobs:
  pluja:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy h5py pyproj
      - name: Radar
        run: |
          M="${{ inputs.mes || '2026-10' }}"
          [ -f "data/pluja_cat/$M.bin.gz" ] && echo "radar de $M ja fet" || python3 scripts/pluja_catalunya.py --mes "$M"
      - name: Pluviòmetres (XEMA i ACA)
        run: python3 scripts/pluviometres_cat.py --mes "${{ inputs.mes || '2026-10' }}"
      - name: Correcció del radar amb els pluviòmetres
        run: |
          M="${{ inputs.mes || '2026-10' }}"
          cp data/pluja_cat/index.json /tmp/index.json; cp data/pluja_cat/${M}_estacions.json /tmp/est.json
          for s in -1 1; do echo "== desfase $s h"; python3 scripts/correccio_cat.py --mes "$M" --desfase $s | grep -E "Validació"; cp /tmp/index.json data/pluja_cat/index.json; cp /tmp/est.json data/pluja_cat/${M}_estacions.json; done
          echo "== desfase 0 h (definitiu)"; python3 scripts/correccio_cat.py --mes "$M"
      - name: Desa
        run: |
          M="${{ inputs.mes || '2026-10' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/sortida && cp data/pluja_cat/${M}* /tmp/sortida/
          python3 -c "import json;print(json.dumps(json.load(open('data/pluja_cat/index.json'))['mesos']['$M']))" > /tmp/mes.json
          B="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$B" && git reset -q --hard "origin/$B"
            cp /tmp/sortida/* data/pluja_cat/
            python3 -c "import json;p='data/pluja_cat/index.json';d=json.load(open(p));d['mesos']['$M']=json.load(open('/tmp/mes.json'));json.dump(d,open(p,'w'),indent=1,ensure_ascii=False)"
            git add data/pluja_cat/
            git diff --cached --quiet && exit 0
            git commit -q -m "Pluja de Catalunya $M per a la web"
            git push origin "HEAD:$B" && exit 0
            sleep $((i*7))
          done; exit 1
