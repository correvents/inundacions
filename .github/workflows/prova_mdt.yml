name: Prova CNIG MDT02
on:
  push:
    branches: ["claude/project-thread-22bcr1"]
    paths: [".github/workflows/prova_mdt.yml"]
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B=https://centrodedescargas.cnig.es/CentroDescargas
          c="-sS -m 60 -A Mozilla/5.0 -c /tmp/ck -b /tmp/ck"
          curl $c "$B/index.jsp" -o /dev/null
          curl $c "$B/catalogo.do?Serie=MDT02" -o /tmp/cat.html
          python3 - <<'PY'
          import re
          s=open('/tmp/cat.html',encoding='utf-8',errors='ignore').read()
          for pat in ['function cargarArchivosSerie', 'ArchivosSerie(){', 'descargaDirS3', 'function cargaArchivosSerieOk', 'url:', 'secuencial']:
              for m in list(re.finditer(re.escape(pat), s))[:4]:
                  print('==', pat); print(s[max(0,m.start()-300):m.start()+1200].replace('\t',' '))
          PY
          true
