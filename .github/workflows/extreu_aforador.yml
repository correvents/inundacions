name: Extreu la sèrie d'un sensor de l'arxiu de l'ACA

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Execució d'«Arxiu de l'ACA»"
        required: true
      provider:
        default: "AFORAMENT-EST"
      sensor:
        required: true
      des:
        required: true
      fins:
        required: true
      sortida:
        description: "Ruta al repo, p. ex. data/granollers/episodis/2026-10-04_aforador.json"
        required: true

permissions:
  actions: read
  contents: write

jobs:
  extreu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aca_arxiu
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/art
      - run: |
          tar -xzf /tmp/art/aca_arxiu.tar.gz -C /tmp
          python3 scripts/extreu_aforador.py --arxiu /tmp/aca --provider "${{ inputs.provider }}" --sensor "${{ inputs.sensor }}" \
            --des "${{ inputs.des }}" --fins "${{ inputs.fins }}" --sortida "${{ inputs.sortida }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.sortida }}"
          git diff --cached --quiet && exit 0
          git commit -m "Sèrie de l'aforador ${{ inputs.sensor }}"
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*7)); done; exit 1
