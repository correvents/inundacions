name: Passos de torrentets sota vies (tot Catalunya)

# Detecta, conca per conca, els passos on un torrentet travessa una carretera o una via de tren en terraplè
# (depressió de l'MDT 5 m aigües amunt de la via = llac si l'obra es tapa) i els guals, amb escenaris
# obert / mig tapat / tapat. Fa servir l'MDT de la Release mdt5-cat i les vies d'OSM (Geofabrik).
# Resultat: data/catalunya/passos/cNNN.geojson + index.json. Vegeu scripts/passos_cat.py.

on:
  workflow_dispatch:
    inputs:
      conques:
        description: "Conques: ids separats per comes o «totes»"
        default: "124,125,188,199"
      lots:
        description: "Feines (lots de conques)"
        default: "20"
  push:
    branches: [claude/project-thread-yat9y6]
    paths: [scripts/passos_cat.py, .github/workflows/passos_cat.yml]

permissions:
  contents: write

env:
  CONQUES: ${{ inputs.conques || 'totes' }}

jobs:
  prepara:
    runs-on: ubuntu-latest
    outputs:
      matriu: ${{ steps.m.outputs.matriu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy scipy shapely pyproj rasterio requests osmium
      - id: m
        run: echo "matriu=$(python3 scripts/mdt_cat.py lots --lots '${{ inputs.lots || '20' }}' --conques '${{ env.CONQUES }}')" >> "$GITHUB_OUTPUT"
      - name: Vies d'OSM (Geofabrik, Catalunya)
        run: |
          # l'URL de l'extracte de Catalunya surt de l'índex de Geofabrik (no l'endevinem)
          url=$(curl -sSfL https://download.geofabrik.de/index-v1-nogeom.json | python3 -c "import json,sys; f=[x['properties'] for x in json.load(sys.stdin)['features'] if 'catal' in x['properties']['id'].lower() or 'catal' in x['properties']['name'].lower()]; print(f[0]['urls']['pbf'])")
          echo "Extracte: $url"
          for i in 1 2 3; do curl -sSfL -o /tmp/cat.osm.pbf "$url" && break; sleep 30; done
          ls -la /tmp/cat.osm.pbf
          python3 scripts/passos_cat.py osm --pbf /tmp/cat.osm.pbf --sortida /tmp/vies.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: vies
          path: /tmp/vies.json.gz

  calcula:
    needs: prepara
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.prepara.outputs.matriu) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy pandas scipy rasterio pyproj shapely pysheds numba
      - uses: actions/download-artifact@v4
        with:
          name: vies
          path: /tmp
      - name: Conques ${{ matrix.lot }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/mdt; fallades=""
          for id in ${{ matrix.lot }}; do
            nom=$(printf "c%03d" "$id")
            if gh release download mdt5-cat -R "${{ github.repository }}" -p "mdt5_$nom.tif" -D /tmp/mdt --clobber && \
               timeout 3600 python3 scripts/passos_cat.py conca --id "$id" --mdt "/tmp/mdt/mdt5_$nom.tif" --vies /tmp/vies.json.gz; then :
            else fallades="$fallades $id"; fi
            rm -f /tmp/mdt/*.tif
          done
          echo "Fallades:$fallades"; mkdir -p /tmp/sortida
          # només les conques d'aquest lot: si cada lot puja tota la carpeta, en ajuntar-los el mateix fitxer es pot escriure barrejat
          for id in ${{ matrix.lot }}; do f=$(printf "data/catalunya/passos/c%03d.geojson" "$id"); [ -f "$f" ] && cp "$f" /tmp/sortida/; done
          echo "$fallades" > /tmp/sortida/fallades_${{ strategy.job-index }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passos-${{ strategy.job-index }}
          path: /tmp/sortida/
          if-no-files-found: ignore

  desa:
    needs: calcula
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: passos-*
          merge-multiple: true
          path: /tmp/art
      - run: pip install -q numpy shapely pyproj rasterio scipy
      - name: Desa
        run: |
          mkdir -p data/catalunya/passos
          f=$(cat /tmp/art/fallades_*.txt 2>/dev/null | tr -s ' \n' ' '); rm -f /tmp/art/fallades_*.txt
          cp -r /tmp/art/. data/catalunya/passos/ 2>/dev/null || true
          python3 scripts/passos_cat.py index
          echo "### Passos: conques fallades: ${f:-cap}" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalunya/passos
          git diff --cached --quiet && exit 0
          git commit -m "Passos de torrentets sota vies (MDT 5 m + OSM)"
          for i in 1 2 3 4; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0; sleep $((i*5)); done; exit 1
