name: Explora dades Bombers (temporal)
on: workflow_dispatch
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in bombers "serveis%20bombers" "actuacions%20bombers" "intervencions" "inundacions"; do
            echo "=== $q"
            curl -s "https://analisi.transparenciacatalunya.cat/api/catalog/v1?limit=25&q=$q" > r.json
            jq -r '.results[]? | [.resource.id, .resource.name, (.resource.columns_name|join(","))] | @tsv' r.json | cut -c1-500 || head -c 500 r.json
            head -c 300 r.json; echo
          done
