name: Estrenyiments de llera (tot Catalunya)

# Capacitat de cada tram de llera amb el MET 2 m de l'ICGC (Release met21-cat; si no hi és, met2-cat), comparada amb
# els cabals de T2 a T500, i estrenyiments que desborden primer. Comprovació amb les zones inundables de l'ACA de la
# caixa de cada conca (WFS). Resultat: data/catalunya/estrenyiments/cNNN.json + index.json + docs/estrenyiments*.md;
# les seccions (cNNN.json.gz) van a la Release estrenyiments-cat. Vegeu scripts/estrenyiments.py.

on:
  workflow_dispatch:
    inputs:
      conques:
        description: "Conques: ids separats per comes o «totes»"
        default: "totes"
      lots:
        description: "Feines (lots de conques)"
        default: "20"
  push:
    branches: [claude/project-thread-dhfffz]
    paths: [.github/workflows/estrenyiments.yml]

permissions:
  contents: write

env:
  CONQUES: ${{ inputs.conques || 'totes' }}

jobs:
  prepara:
    runs-on: ubuntu-latest
    outputs:
      matriu: ${{ steps.m.outputs.matriu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy scipy shapely pyproj rasterio requests
      - id: m
        run: echo "matriu=$(python3 scripts/mdt_cat.py lots --lots '${{ inputs.lots || '20' }}' --conques '${{ env.CONQUES }}')" >> "$GITHUB_OUTPUT"
      - name: Release estrenyiments-cat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view estrenyiments-cat -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create estrenyiments-cat -R "${{ github.repository }}" --title "Estrenyiments de llera: seccions" \
              --notes "Seccions cada 20 m de totes les lleres (scripts/estrenyiments.py): capacitat, període de desbordament, Q10/Q100. Una per conca, cNNN.json.gz."

  calcula:
    needs: prepara
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.prepara.outputs.matriu) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy pandas scipy rasterio pyproj shapely pysheds numba requests
      - name: Conques ${{ matrix.lot }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"; mkdir -p /tmp/t /tmp/sortida; fallades=""; sense_met=""
          for id in ${{ matrix.lot }}; do
            nom=$(printf "c%03d" "$id"); rm -f /tmp/t/*.tif
            gh release download mdt5-cat -R "$R" -p "mdt5_$nom.tif" -D /tmp/t --clobber || { fallades="$fallades $id"; continue; }
            gh release download cobertes-cat -R "$R" -p "cobertes5_$nom.tif" -D /tmp/t --clobber || echo "sense cobertes $nom"
            MET=""; FONT=""
            if gh release download met21-cat -R "$R" -p "met21_$nom.tif" -D /tmp/t --clobber; then
              MET="--met /tmp/t/met21_$nom.tif"; FONT="MET 2 m ICGC (LiDAR 2021-2023)"
            elif gh release download met2-cat -R "$R" -p "met2_$nom.tif" -D /tmp/t --clobber; then
              MET="--met /tmp/t/met2_$nom.tif"; FONT="MET 2 m ICGC (LiDAR 2008-2011)"
            else sense_met="$sense_met $id"; fi
            COB=""; [ -f "/tmp/t/cobertes5_$nom.tif" ] && COB="--cobertes /tmp/t/cobertes5_$nom.tif"
            if timeout 3600 python3 scripts/estrenyiments.py --seccions /tmp/sortida/seccions conca --id "$id" \
                 --mdt "/tmp/t/mdt5_$nom.tif" $MET ${FONT:+--font-met "$FONT"} $COB; then
              # comprovació amb les zones inundables de l'ACA (si el WFS respon i n'hi ha a la conca)
              if python3 scripts/estrenyiments.py zones --id "$id" --sortida "/tmp/zones_$nom"; then
                python3 scripts/estrenyiments.py --seccions /tmp/sortida/seccions valida --id "$id" --zones "/tmp/zones_$nom" | tail -1 || true
              fi
              cp "data/catalunya/estrenyiments/$nom.json" /tmp/sortida/
            else fallades="$fallades $id"; fi
          done
          echo "Fallades:$fallades  Sense MET:$sense_met"
          echo "$fallades" > /tmp/sortida/fallades_${{ strategy.job-index }}.txt
          echo "$sense_met" > /tmp/sortida/sensemet_${{ strategy.job-index }}.txt
          ls /tmp/sortida/seccions/*.json.gz >/dev/null 2>&1 && \
            for i in 1 2 3; do gh release upload estrenyiments-cat -R "$R" /tmp/sortida/seccions/*.json.gz --clobber && break; sleep 20; done
          rm -rf /tmp/sortida/seccions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estrenyiments-${{ strategy.job-index }}
          path: /tmp/sortida/
          if-no-files-found: ignore

  desa:
    needs: calcula
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: estrenyiments-*
          merge-multiple: true
          path: /tmp/art
      - run: pip install -q numpy scipy shapely pyproj rasterio
      - name: Desa
        run: |
          mkdir -p data/catalunya/estrenyiments
          f=$(cat /tmp/art/fallades_*.txt 2>/dev/null | tr -s ' \n' ' '); s=$(cat /tmp/art/sensemet_*.txt 2>/dev/null | tr -s ' \n' ' ')
          rm -f /tmp/art/fallades_*.txt /tmp/art/sensemet_*.txt
          cp /tmp/art/c*.json data/catalunya/estrenyiments/ 2>/dev/null || true
          python3 scripts/estrenyiments.py index
          python3 scripts/estrenyiments.py informe
          python3 scripts/estrenyiments.py informe --ids totes --sortida docs/estrenyiments_catalunya.md
          echo "### Estrenyiments: fallades: ${f:-cap}; sense MET (MDT 5 m): ${s:-cap}" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalunya/estrenyiments docs/estrenyiments.md docs/estrenyiments_catalunya.md
          git diff --cached --quiet && exit 0
          git commit -m "Estrenyiments de llera (MET 2 m, cabals T2-T500) [skip ci]"
          for i in 1 2 3 4; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0; sleep $((i*5)); done; exit 1
